<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Group Secret WhatsApp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-anim {
            animation: fadeIn 0.2s ease-out forwards;
        }
        .msg-container:hover .msg-actions {
            opacity: 1;
            pointer-events: auto;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--sb-track, #0b141a);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--sb-thumb, #202c33);
            border-radius: 4px;
        }
    </style>
</head>
<body id="body-theme" class="bg-gradient-to-br from-[#0b141a] via-[#111b21] to-[#070d12] text-[#e9edef] h-screen flex flex-col justify-center items-center m-0 font-sans p-0 md:p-4 transition-colors duration-300">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="bg-[#111b21]/95 backdrop-blur-xl p-8 rounded-2xl shadow-2xl w-96 border border-[#2a3942]/60 shadow-[0_0_30px_rgba(0,168,132,0.1)]">
        <div class="text-center mb-6">
            <div class="inline-block p-3 rounded-full bg-[#00a884]/10 text-[#00a884] text-3xl mb-2 shadow-[0_0_15px_rgba(0,168,132,0.3)]">👥</div>
            <h1 class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-[#00a884] to-[#25d366]">Secret WhatsApp</h1>
            <p class="text-xs text-[#8696a0] mt-1">Enter room & your name</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#00a884] mb-1">Room Passcode</label>
                <input type="text" id="room-input" placeholder="e.g. group-room-123" class="w-full bg-[#2a3942]/50 border border-[#374248] rounded-xl p-3 text-white focus:outline-none focus:border-[#00a884] focus:ring-1 focus:ring-[#00a884] transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#00a884] mb-1">Your Nickname</label>
                <input type="text" id="name-input" placeholder="e.g. Alex" class="w-full bg-[#2a3942]/50 border border-[#374248] rounded-xl p-3 text-white focus:outline-none focus:border-[#00a884] focus:ring-1 focus:ring-[#00a884] transition">
            </div>
            <button onclick="joinRoom()" class="w-full bg-gradient-to-r from-[#00a884] to-[#25d366] text-black font-bold py-3 rounded-xl hover:opacity-90 shadow-[0_4px_20px_rgba(0,168,132,0.4)] transition cursor-pointer active:scale-95">
                Join Secure Room 🚀
            </button>
        </div>
    </div>
        <!-- CHAT SCREEN -->
    <div id="chat-screen" class="hidden w-full max-w-4xl h-full md:h-[92vh] bg-[#111b21] md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-[#222d34] shadow-[0_0_40px_rgba(0,0,0,0.8)] transition-colors duration-300">
        <!-- Chat Header -->
        <div id="chat-header" class="bg-[#202c33] px-5 py-3 flex items-center justify-between border-b border-[#2a3942] transition-colors duration-300">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-[#00a884] to-[#25d366] flex items-center justify-center text-black font-bold text-base shadow">💬</div>
                <div>
                    <h2 id="room-title" class="font-bold text-white text-sm md:text-base tracking-wide">Room: </h2>
                    <p id="typing-status" class="text-[11px] text-[#00a884] h-3.5 font-medium animate-pulse">🟢 Active</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="startCall('audio')" class="bg-[#2a3942] hover:bg-[#374248] text-white p-2 rounded-lg transition text-sm cursor-pointer" title="Voice Call">📞</button>
                <button onclick="startCall('video')" class="bg-[#2a3942] hover:bg-[#374248] text-white p-2 rounded-lg transition text-sm cursor-pointer" title="Video Call">📹</button>
                <button onclick="toggleTheme()" id="theme-btn" class="text-xs bg-[#2a3942] hover:bg-[#374248] text-[#8696a0] hover:text-white px-2.5 py-2 rounded-lg transition font-semibold cursor-pointer border border-[#374248]" title="Toggle Mode">☀️</button>
                <button onclick="leaveRoom()" class="text-xs bg-[#2a3942] hover:bg-[#374248] text-[#8696a0] hover:text-white px-3 py-2 rounded-lg transition font-semibold cursor-pointer border border-[#374248]">Leave</button>
            </div>
        </div>

        <!-- Messages Box -->
        <div id="messages-container" class="flex-1 p-5 overflow-y-auto space-y-4 bg-[#0b141a] transition-colors duration-300">
            <!-- Dynamic messages load here -->
        </div>

        <!-- Input Box -->
        <div id="chat-footer" class="bg-[#202c33] px-4 py-2.5 flex items-center gap-2 border-t border-[#2a3942] transition-colors duration-300">
            <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
            <button onclick="document.getElementById('file-input').click()" class="text-[#8696a0] hover:text-[#00a884] p-2 rounded-full transition cursor-pointer text-xl flex items-center justify-center" title="Attach File / Image">
                📎
            </button>
            <input type="text" id="message-input" placeholder="Type a message" oninput="updateTypingStatus()" onkeypress="handleKeyPress(event)" class="flex-1 bg-[#2a3942] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none placeholder-[#8696a0]">
            <button onclick="sendMessage()" class="text-[#8696a0] hover:text-[#00a884] p-2 rounded-full transition cursor-pointer text-xl flex items-center justify-center" title="Send Message">
                <svg viewBox="0 0 24 24" height="24" width="24" preserveAspectRatio="xMidYMid meet" version="1.1" x="0px" y="0px"><path fill="currentColor" d="M1.101,21.757L23.8,12.028L1.101,2.3l0.011,7.912l13.613,1.816L1.112,13.845 L1.101,21.757z"></path></svg>
            </button>
        </div>
    </div>
        <!-- CALL UI MODAL WITH SWITCH CAMERA -->
    <div id="call-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4">
        <div class="relative w-full max-w-4xl bg-[#111b21] rounded-2xl overflow-hidden border border-[#2a3942] shadow-2xl flex flex-col items-center p-4 md:p-6 space-y-4">
            <h3 id="call-status-text" class="text-white font-bold text-lg animate-pulse">Call Active</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full justify-items-center">
                <div class="relative w-full max-w-sm">
                    <video id="remote-video" autoplay playsinline class="w-full h-48 md:h-64 bg-black rounded-xl object-cover border border-[#2a3942] shadow-xl"></video>
                    <span class="absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 rounded text-[10px] text-white">Participant</span>
                </div>
                <div class="relative w-full max-w-sm">
                    <video id="local-video" autoplay playsinline muted class="w-full h-48 md:h-64 bg-black rounded-xl object-cover border border-[#2a3942] shadow-xl"></video>
                    <span class="absolute bottom-2 left-2 bg-black/70 px-2 py-0.5 rounded text-[10px] text-white">You</span>
                </div>
            </div>
            <audio id="remote-audio" autoplay></audio>

            <div class="flex items-center gap-2 md:gap-3 flex-wrap justify-center mt-2">
                <button id="mute-btn" onclick="toggleMute()" class="bg-[#2a3942] hover:bg-[#374248] text-white px-3.5 py-2.5 rounded-xl transition text-xs md:text-sm cursor-pointer font-medium shadow">🎙️ Mute</button>
                <button id="cam-btn" onclick="toggleCamera()" class="bg-[#2a3942] hover:bg-[#374248] text-white px-3.5 py-2.5 rounded-xl transition text-xs md:text-sm cursor-pointer font-medium shadow">📹 Stop Cam</button>
                <button id="switch-cam-btn" onclick="switchCamera()" class="bg-[#00a884] hover:bg-[#008f72] text-black px-4 py-2.5 rounded-xl transition text-xs md:text-sm cursor-pointer font-bold shadow">🔄 Switch Cam</button>
                <button onclick="endCall()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl transition text-xs md:text-sm cursor-pointer shadow">End Call 📴</button>
            </div>
        </div>
    </div>

    <!-- INCOMING CALL RINGING MODAL -->
    <div id="incoming-call-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#202c33] border border-[#2a3942] p-6 rounded-2xl w-80 shadow-2xl text-center space-y-4">
            <div class="text-4xl animate-bounce">📞</div>
            <h3 id="incoming-caller-text" class="font-bold text-white text-base">Incoming Call...</h3>
            <div class="flex gap-3">
                <button onclick="acceptCall()" class="flex-1 bg-[#00a884] hover:bg-[#008f72] text-black font-bold py-2.5 rounded-xl transition">Accept ✅</button>
                <button onclick="rejectCall()" class="flex-1 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 py-2.5 rounded-xl font-medium transition">Decline ❌</button>
            </div>
        </div>
    </div>

    <!-- MESSAGE INFO MODAL -->
    <div id="info-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#202c33] border border-[#2a3942] p-6 rounded-2xl w-full max-w-md shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-[#2a3942] pb-3">
                <h3 class="font-bold text-white text-base">Message Info</h3>
                <button onclick="closeInfoModal()" class="text-[#8696a0] hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div class="space-y-4 max-h-60 overflow-y-auto">
                <div>
                    <p class="text-xs font-bold text-[#00a884] uppercase tracking-wider mb-2">Read by</p>
                    <div id="read-by-list" class="space-y-1 text-sm text-white"></div>
                </div>
                <div>
                    <p class="text-xs font-bold text-[#8696a0] uppercase tracking-wider mb-2">Delivered to</p>
                    <div id="delivered-to-list" class="space-y-1 text-sm text-white"></div>
                </div>
            </div>
            <button onclick="closeInfoModal()" class="w-full bg-[#2a3942] hover:bg-[#374248] text-white py-2 rounded-xl text-sm transition">Close</button>
        </div>
    </div>

    <!-- DELETE OPTIONS MODAL -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-[#202c33] border border-[#2a3942] p-6 rounded-2xl w-80 shadow-2xl text-center space-y-4">
            <h3 class="font-bold text-white text-base">Delete Message?</h3>
            <div class="space-y-2">
                <button onclick="confirmDelete('me')" class="w-full bg-[#2a3942] hover:bg-[#374248] text-white py-2.5 rounded-xl font-medium transition text-sm">Delete for Me</button>
                <button onclick="confirmDelete('everyone')" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 py-2.5 rounded-xl font-medium transition text-sm">Delete for Everyone</button>
                <button onclick="closeDeleteModal()" class="w-full text-[#8696a0] hover:text-white py-2 text-sm">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmVtAF5wQrcrzlfjpTAZoLDFbyrpr9FmY",
            authDomain: "secret-d7e10.firebaseapp.com",
            databaseURL: "https://secret-d7e10-default-rtdb.firebaseio.com",
            projectId: "secret-d7e10",
            storageBucket: "secret-d7e10.firebasestorage.app",
            messagingSenderId: "51435664110",
            appId: "1:51435664110:web:feb706ce8a92f182dd39ff"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = "";
        let currentUser = "";
        let typingTimeout = null;
        let selectedMessageKey = null;
        let isDarkMode = true;

        let peerConnection;
        let localStream;
        let incomingCallData = null;
        let isMuted = false;
        let isCameraOff = false;
        let useFrontCamera = true;
        let currentCallType = 'video';

        const servers = {
            iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }]
        };

        const nameColors = {};
        const colorPalette = ['#00a884', '#34b7f1', '#ffbc42', '#ff5722', '#ab47bc', '#26a69a', '#ec407a'];
        function getColorForUser(name) {
            if (!nameColors[name]) {
                let hash = 0;
                for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
                nameColors[name] = colorPalette[Math.abs(hash) % colorPalette.length];
            }
            return nameColors[name];
        }

        function sanitizeRoomName(room) {
            return room.replace(/[.#$\/\[\]]/g, "_").toLowerCase();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedRoom = localStorage.getItem('secret_chat_room');
            const savedUser = localStorage.getItem('secret_chat_user');
            const savedTheme = localStorage.getItem('secret_chat_theme');

            if (savedTheme === 'light') toggleTheme(true);
            if (savedRoom && savedUser) {
                document.getElementById('room-input').value = savedRoom;
                document.getElementById('name-input').value = savedUser;
                joinRoom(true);
            }

            if (Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        });

        function toggleTheme(forcedLight = false) {
            isDarkMode = forcedLight ? false : !isDarkMode;
            const body = document.getElementById('body-theme');
            const chatScreen = document.getElementById('chat-screen');
            const chatHeader = document.getElementById('chat-header');
            const chatFooter = document.getElementById('chat-footer');
            const msgContainer = document.getElementById('messages-container');
            const themeBtn = document.getElementById('theme-btn');

            if (isDarkMode) {
                body.className = "bg-gradient-to-br from-[#0b141a] via-[#111b21] to-[#070d12] text-[#e9edef] h-screen flex flex-col justify-center items-center m-0 font-sans p-0 md:p-4 transition-colors duration-300";
                chatScreen.className = "w-full max-w-4xl h-full md:h-[92vh] bg-[#111b21] md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-[#222d34] shadow-[0_0_40px_rgba(0,0,0,0.8)] transition-colors duration-300";
                chatHeader.className = "bg-[#202c33] px-5 py-3 flex items-center justify-between border-b border-[#2a3942] transition-colors duration-300";
                chatFooter.className = "bg-[#202c33] px-4 py-2.5 flex items-center gap-2 border-t border-[#2a3942] transition-colors duration-300";
                msgContainer.className = "flex-1 p-5 overflow-y-auto space-y-4 bg-[#0b141a] transition-colors duration-300";
                themeBtn.innerText = "☀️";
                localStorage.setItem('secret_chat_theme', 'dark');
            } else {
                body.className = "bg-gradient-to-br from-[#f0f2f5] via-[#efeae2] to-[#d9dad7] text-[#111b21] h-screen flex flex-col justify-center items-center m-0 font-sans p-0 md:p-4 transition-colors duration-300";
                chatScreen.className = "w-full max-w-4xl h-full md:h-[92vh] bg-white md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-gray-300 shadow-[0_0_40px_rgba(0,0,0,0.1)] transition-colors duration-300";
                chatHeader.className = "bg-[#f0f2f5] px-5 py-3 flex items-center justify-between border-b border-gray-300 transition-colors duration-300";
                chatFooter.className = "bg-[#f0f2f5] px-4 py-2.5 flex items-center gap-2 border-t border-gray-300 transition-colors duration-300";
                msgContainer.className = "flex-1 p-5 overflow-y-auto space-y-4 bg-[#efeae2] transition-colors duration-300";
                themeBtn.innerText = "🌙";
                localStorage.setItem('secret_chat_theme', 'light');
            }
        }

        function joinRoom(isAuto = false) {
            const rawRoom = document.getElementById('room-input').value.trim();
            const name = document.getElementById('name-input').value.trim();

            if (!rawRoom || !name) {
                if (!isAuto) alert("Please fill in both fields!");
                return;
            }

            currentRoom = sanitizeRoomName(rawRoom);
            currentUser = name;

            localStorage.setItem('secret_chat_room', rawRoom);
            localStorage.setItem('secret_chat_user', name);

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('room-title').innerText = "Room: " + rawRoom;

            loadMessages();
            listenForTyping();
            listenForCalls();
            updatePresence(true);
        }

        function updatePresence(isOnline) {
            if (!currentRoom || !currentUser) return;
            db.ref(`rooms/${currentRoom}/presence/${currentUser}`).set({
                online: isOnline,
                lastSeen: Date.now()
            });
        }

        window.addEventListener('beforeunload', () => {
            if (currentRoom && currentUser) {
                db.ref(`rooms/${currentRoom}/typing/${currentUser}`).set(false);
                db.ref(`rooms/${currentRoom}/presence/${currentUser}`).update({ online: false });
            }
        });

        function leaveRoom() {
            updatePresence(false);
            localStorage.removeItem('secret_chat_room');
            localStorage.removeItem('secret_chat_user');
            location.reload();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function updateTypingStatus() {
            if (!currentRoom || !currentUser) return;
            const typingRef = db.ref(`rooms/${currentRoom}/typing/${currentUser}`);
            typingRef.set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => typingRef.set(false), 2000);
        }

        function listenForTyping() {
            db.ref(`rooms/${currentRoom}/typing`).on('value', (snapshot) => {
                const typingData = snapshot.val() || {};
                let typingUsers = [];
                for (let user in typingData) {
                    if (user !== currentUser && typingData[user] === true) typingUsers.push(user);
                }
                const statusEl = document.getElementById('typing-status');
                if (typingUsers.length > 0) {
                    statusEl.innerText = typingUsers.join(', ') + " is typing...";
                } else {
                    statusEl.innerText = "🟢 Active in group";
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            db.ref(`rooms/${currentRoom}/typing/${currentUser}`).set(false);
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const messageData = {
                sender: currentUser,
                text: text,
                type: 'text',
                time: timeString,
                deliveredTo: { [currentUser]: true },
                readBy: { [currentUser]: true },
                timestamp: Date.now()
            };

            db.ref(`rooms/${currentRoom}/messages`).push(messageData);
            input.value = "";
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 1500000) {
                alert("File size under 1.5MB allowed!");
                event.target.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const messageData = {
                    sender: currentUser,
                    fileName: file.name,
                    fileData: e.target.result,
                    fileType: file.type,
                    type: file.type.startsWith('image/') ? 'image' : 'file',
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    deliveredTo: { [currentUser]: true },
                    readBy: { [currentUser]: true },
                    timestamp: Date.now()
                };
                db.ref(`rooms/${currentRoom}/messages`).push(messageData);
                event.target.value = "";
            };
            reader.readAsDataURL(file);
        }

        function loadMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = "";

            db.ref(`rooms/${currentRoom}/messages`).limitToLast(50).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                renderSingleMessage(snapshot.key, msg);

                if (msg.sender !== currentUser && document.hidden && Notification.permission === "granted") {
                    new Notification(`New message from ${msg.sender}`, {
                        body: msg.text || "Sent an attachment",
                        icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png"
                    });
                }
            });

            db.ref(`rooms/${currentRoom}/messages`).on('child_changed', (snapshot) => {
                const existingEl = document.getElementById(`msg-${snapshot.key}`);
                if (existingEl && snapshot.val().deletedForEveryone) {
                    existingEl.innerHTML = `<p class="italic text-[#8696a0] text-xs">🔒 This message was deleted</p>`;
                }
            });

            db.ref(`rooms/${currentRoom}/messages`).on('child_removed', (snapshot) => {
                const existingEl = document.getElementById(`msg-${snapshot.key}`);
                if (existingEl) existingEl.remove();
            });
        }

        function renderSingleMessage(key, msg) {
            const container = document.getElementById('messages-container');
            const isMe = msg.sender === currentUser;
            const userColor = getColorForUser(msg.sender);

            if (msg.deletedForMe && msg.deletedForMe[currentUser]) return;

            const messageDiv = document.createElement('div');
            messageDiv.id = `msg-${key}`;
            messageDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} message-anim relative msg-container my-1`;

            let contentHTML = '';
            if (msg.deletedForEveryone) {
                contentHTML = `<p class="italic text-[#8696a0] text-xs">🔒 This message was deleted</p>`;
            } else if (msg.type === 'image') {
                contentHTML = `
                    <a href="${msg.fileData}" target="_blank" class="block mb-1">
                        <img src="${msg.fileData}" class="max-w-xs rounded-xl max-h-60 object-cover border border-white/10 shadow-md">
                    </a>
                    <p class="text-[10px] text-[#8696a0] truncate max-w-xs">${escapeHTML(msg.fileName || '')}</p>
                `;
            } else if (msg.type === 'file') {
                contentHTML = `
                    <div class="flex items-center gap-3 mb-1 bg-[#111b21]/80 p-2.5 rounded-xl border border-[#374248]">
                        <span class="text-2xl">📄</span>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold truncate max-w-[170px] text-white">${escapeHTML(msg.fileName || 'Document')}</p>
                            <a href="${msg.fileData}" download="${msg.fileName || 'file'}" class="text-[11px] text-[#00a884] font-semibold hover:underline">Download 📥</a>
                        </div>
                    </div>
                `;
            } else {
                contentHTML = `<p class="break-words pb-1 text-sm md:text-base leading-relaxed">${escapeHTML(msg.text || '')}</p>`;
            }

            let actionButtons = '';
            if (!msg.deletedForEveryone) {
                const infoBtn = isMe ? `<button onclick="openMessageInfo('${key}')" class="bg-[#202c33] hover:bg-[#2a3942] text-[#8696a0] hover:text-[#00a884] px-1.5 py-0.5 rounded text-xs shadow border border-[#2a3942]" title="Info">ℹ️</button>` : '';
                const deleteBtn = isMe ? `<button onclick="openDeleteModal('${key}')" class="bg-[#202c33] hover:bg-[#2a3942] text-[#8696a0] hover:text-red-400 px-1.5 py-0.5 rounded text-xs shadow border border-[#2a3942]" title="Delete">🗑️</button>` : '';
                if (infoBtn || deleteBtn) {
                    actionButtons = `<div class="msg-actions opacity-0 transition absolute -top-3 ${isMe ? 'left-2' : 'right-2'} flex items-center gap-1 z-10">${infoBtn}${deleteBtn}</div>`;
                }
            }

            const bubbleColor = isMe ? 'bg-[#005c4b] text-white' : (isDarkMode ? 'bg-[#202c33] text-white' : 'bg-white text-gray-900 border border-gray-200');

            messageDiv.innerHTML = `
                <div class="relative max-w-[75%] md:max-w-[65%] rounded-2xl px-4 py-2 shadow-lg ${bubbleColor} ${isMe ? 'rounded-tr-none' : 'rounded-tl-none'}">
                    ${actionButtons}
                    ${!isMe ? `<p class="text-xs font-bold mb-1" style="color: ${userColor};">${msg.sender}</p>` : ''}
                    ${contentHTML}
                    <div class="text-[10px] text-[#8696a0] text-right mt-1 font-medium flex items-center justify-end gap-1">
                        <span>${msg.time || ''}</span>
                        ${isMe ? '<span class="text-[#34b7f1] font-bold">✓✓</span>' : ''}
                    </div>
                </div>
            `;

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function startCall(type) {
            currentCallType = type;
            document.getElementById('call-modal').classList.remove('hidden');
            document.getElementById('call-status-text').innerText = "Starting Call...";

            try {
                const constraints = {
                    video: type === 'video' ? { facingMode: useFrontCamera ? 'user' : 'environment' } : false,
                    audio: true
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('local-video').srcObject = localStream;

                peerConnection = new RTCPeerConnection(servers);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = event => {
                    document.getElementById('remote-video').srcObject = event.streams[0];
                };

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        db.ref(`rooms/${currentRoom}/call/candidates`).push(event.candidate.toJSON());
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                db.ref(`rooms/${currentRoom}/call`).set({
                    type: type,
                    caller: currentUser,
                    offer: { type: offer.type, sdp: offer.sdp }
                });
                document.getElementById('call-status-text').innerText = "Calling Participants...";
            } catch (err) {
                alert("Camera/Mic permission denied or unavailable.");
                endCall();
            }
        }

        function listenForCalls() {
            db.ref(`rooms/${currentRoom}/call`).on('value', async snapshot => {
                const data = snapshot.val();
                // If call node is deleted or empty, auto-dismiss any open call UI or ringing popups
                if (!data) {
                    forceCloseCallUI();
                    return;
                }

                if (data.caller !== currentUser && !peerConnection) {
                    incomingCallData = data;
                    document.getElementById('incoming-caller-text').innerText = `${data.caller} is calling (${data.type})...`;
                    document.getElementById('incoming-call-modal').classList.remove('hidden');
                }
            });

            db.ref(`rooms/${currentRoom}/call/answer`).on('value', async snapshot => {
                const answer = snapshot.val();
                if (answer && peerConnection && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    document.getElementById('call-status-text').innerText = "Call Connected 🟢";
                }
            });

            db.ref(`rooms/${currentRoom}/call/candidates`).on('child_added', async snapshot => {
                const candidate = snapshot.val();
                if (peerConnection && candidate) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
                }
            });
        }

        async function acceptCall() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            document.getElementById('call-modal').classList.remove('hidden');
            document.getElementById('call-status-text').innerText = "Connecting Call...";
            currentCallType = incomingCallData.type;

            try {
                const constraints = {
                    video: currentCallType === 'video' ? { facingMode: useFrontCamera ? 'user' : 'environment' } : false,
                    audio: true
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('local-video').srcObject = localStream;

                peerConnection = new RTCPeerConnection(servers);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = event => {
                    document.getElementById('remote-video').srcObject = event.streams[0];
                };

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        db.ref(`rooms/${currentRoom}/call/candidates`).push(event.candidate.toJSON());
                    }
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallData.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                db.ref(`rooms/${currentRoom}/call/answer`).set({ type: answer.type, sdp: answer.sdp });
                document.getElementById('call-status-text').innerText = "Call Connected 🟢";
            } catch (err) {
                alert("Could not access camera/mic.");
                endCall();
            }
        }

        function rejectCall() {
            document.getElementById('incoming-call-modal').classList.add('hidden');
            db.ref(`rooms/${currentRoom}/call`).remove();
        }

        function endCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            peerConnection = null;
            isMuted = false;
            isCameraOff = false;
            document.getElementById('mute-btn').innerText = "🎙️ Mute";
            document.getElementById('cam-btn').innerText = "📹 Stop Cam";
            document.getElementById('call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.add('hidden');
            // Remove call node from Firebase so all other participants' screens dismiss automatically
            db.ref(`rooms/${currentRoom}/call`).remove();
        }

        function forceCloseCallUI() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            peerConnection = null;
            isMuted = false;
            isCameraOff = false;
            document.getElementById('mute-btn').innerText = "🎙️ Mute";
            document.getElementById('cam-btn').innerText = "📹 Stop Cam";
            document.getElementById('call-modal').classList.add('hidden');
            document.getElementById('incoming-call-modal').classList.add('hidden');
        }

        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                document.getElementById('mute-btn').innerText = isMuted ? "🎙️ Unmute" : "🎙️ Mute";
            }
        }

        function toggleCamera() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                isCameraOff = !isCameraOff;
                videoTrack.enabled = !isCameraOff;
                document.getElementById('cam-btn').innerText = isCameraOff ? "📹 Start Cam" : "📹 Stop Cam";
            } else {
                alert("This is an audio-only call session!");
            }
        }

        async function switchCamera() {
            if (currentCallType !== 'video') {
                alert("Switch camera is only available in video calls!");
                return;
            }
            useFrontCamera = !useFrontCamera;
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('local-video').srcObject = localStream;

                if (peerConnection) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            } catch (err) {
                alert("Error switching camera: " + err.message);
            }
        }

        function openMessageInfo(msgKey) {
            db.ref(`rooms/${currentRoom}/messages/${msgKey}`).once('value', (snapshot) => {
                const msg = snapshot.val();
                if (!msg) return;
                const readByList = document.getElementById('read-by-list');
                const deliveredToList = document.getElementById('delivered-to-list');
                readByList.innerHTML = ''; deliveredToList.innerHTML = '';
                const readBy = msg.readBy || {}; const deliveredTo = msg.deliveredTo || {};
                for (let user in readBy) readByList.innerHTML += `<div class="flex justify-between bg-[#111b21] px-3 py-1.5 rounded-lg"><span>${user}</span> <span class="text-xs text-[#00a884]">Read ✓✓</span></div>`;
                for (let user in deliveredTo) {
                    if (!readBy[user]) deliveredToList.innerHTML += `<div class="flex justify-between bg-[#111b21] px-3 py-1.5 rounded-lg"><span>${user}</span> <span class="text-xs text-[#8696a0]">Delivered ✓</span></div>`;
                }
                document.getElementById('info-modal').classList.remove('hidden');
            });
        }
        function closeInfoModal() { document.getElementById('info-modal').classList.add('hidden'); }
        function openDeleteModal(msgKey) { selectedMessageKey = msgKey; document.getElementById('delete-modal').classList.remove('hidden'); }
        function closeDeleteModal() { selectedMessageKey = null; document.getElementById('delete-modal').classList.add('hidden'); }
        function confirmDelete(type) {
            if (!selectedMessageKey) return;
            if (type === 'me') {
                db.ref(`rooms/${currentRoom}/messages/${selectedMessageKey}/deletedForMe/${currentUser}`).set(true);
                document.getElementById(`msg-${selectedMessageKey}`)?.remove();
            } else if (type === 'everyone') {
                db.ref(`rooms/${currentRoom}/messages/${selectedMessageKey}`).update({ deletedForEveryone: true, text: "", fileData: "", fileName: "" });
            }
            closeDeleteModal();
        }
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
