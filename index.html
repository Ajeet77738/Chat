<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Web - Secure Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-fade {
            animation: fadeIn 0.2s ease-out forwards;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0e1621;
        }
        ::-webkit-scrollbar-thumb {
            background: #232e3c;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-[#e2e8f0] h-screen flex flex-col justify-center items-center m-0 font-sans p-0 md:p-4 overflow-hidden">

    <!-- AUTH CONTAINER (Register / Login) -->
    <div id="auth-screen" class="w-full max-w-md bg-[#17212b] p-8 rounded-2xl shadow-2xl border border-[#232e3c] space-y-6">
        <div class="text-center">
            <div class="inline-block p-3 rounded-full bg-[#2481cc]/20 text-[#2481cc] text-3xl mb-2 shadow">✈️</div>
            <h1 id="auth-title" class="text-2xl font-black text-white tracking-wide">Telegram Secure</h1>
            <p id="auth-subtitle" class="text-xs text-[#7f91a4] mt-1">Connect with anyone using unique username</p>
        </div>

        <!-- Forms Tabs Switcher -->
        <div class="flex bg-[#0e1621] p-1 rounded-xl border border-[#232e3c]">
            <button onclick="switchTab('login')" id="tab-login-btn" class="flex-1 py-2 text-xs font-bold rounded-lg transition bg-[#2481cc] text-white cursor-pointer">Login</button>
            <button onclick="switchTab('register')" id="tab-register-btn" class="flex-1 py-2 text-xs font-bold rounded-lg transition text-[#7f91a4] cursor-pointer">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#7f91a4] mb-1">Unique Username</label>
                <input type="text" id="login-username" placeholder="e.g. alex_99" class="w-full bg-[#0e1621] border border-[#232e3c] rounded-xl p-3 text-white focus:outline-none focus:border-[#2481cc] transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#7f91a4] mb-1">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-[#0e1621] border border-[#232e3c] rounded-xl p-3 text-white focus:outline-none focus:border-[#2481cc] transition">
            </div>
            <button onclick="handleLogin()" class="w-full bg-[#2481cc] hover:bg-[#1d6fa5] text-white font-bold py-3 rounded-xl transition cursor-pointer shadow-lg">Sign In</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" class="space-y-4 hidden">
            <!-- Instructions Box -->
            <div class="bg-[#0e1621] border border-[#2481cc]/30 p-3 rounded-xl text-xs text-[#7f91a4] space-y-1">
                <p class="font-bold text-[#2481cc]">📌 Registration Guidelines:</p>
                <p>• Choose a unique username (no spaces).</p>
                <p>• Password must be secure for your account data.</p>
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#7f91a4] mb-1">Your Full Name</label>
                <input type="text" id="reg-name" placeholder="e.g. Alex Smith" class="w-full bg-[#0e1621] border border-[#232e3c] rounded-xl p-3 text-white focus:outline-none focus:border-[#2481cc] transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#7f91a4] mb-1">Unique Username</label>
                <input type="text" id="reg-username" placeholder="e.g. alex_99" class="w-full bg-[#0e1621] border border-[#232e3c] rounded-xl p-3 text-white focus:outline-none focus:border-[#2481cc] transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#7f91a4] mb-1">Password</label>
                <input type="password" id="reg-password" placeholder="••••••••" class="w-full bg-[#0e1621] border border-[#232e3c] rounded-xl p-3 text-white focus:outline-none focus:border-[#2481cc] transition">
            </div>
            <button onclick="handleRegister()" class="w-full bg-[#2481cc] hover:bg-[#1d6fa5] text-white font-bold py-3 rounded-xl transition cursor-pointer shadow-lg">Create Account</button>
        </div>
    </div>

    <!-- TELEGRAM MAIN CHAT INTERFACE (2-Column Layout) -->
    <div id="telegram-screen" class="hidden w-full max-w-5xl h-full md:h-[94vh] bg-[#17212b] md:rounded-2xl shadow-2xl flex overflow-hidden border border-[#232e3c]">
        
        <!-- LEFT SIDEBAR -->
        <div class="w-full md:w-80 bg-[#17212b] border-r border-[#232e3c] flex flex-col h-full">
            <!-- Sidebar Header with Search -->
            <div class="p-3 bg-[#17212b] border-b border-[#232e3c] flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div id="user-avatar" class="w-9 h-9 rounded-full bg-[#2481cc] flex items-center justify-center font-bold text-white text-sm shadow">A</div>
                        <div>
                            <h3 id="current-user-name" class="font-bold text-white text-sm">User</h3>
                            <p class="text-[10px] text-[#7f91a4]" id="current-user-handle">@handle</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-xs text-[#7f91a4] hover:text-red-400 p-2 transition cursor-pointer" title="Logout">🚪</button>
                </div>
                <!-- Search Bar -->
                <div class="relative mt-1">
                    <input type="text" id="search-user-input" oninput="filterUsers(this.value)" placeholder="Search users by username..." class="w-full bg-[#0e1621] text-xs text-white rounded-xl py-2 px-3 pl-8 focus:outline-none border border-[#232e3c]">
                    <span class="absolute left-2.5 top-2 text-xs text-[#7f91a4]">🔍</span>
                </div>
            </div>

            <!-- Users / Chats List -->
            <div id="users-list-container" class="flex-1 overflow-y-auto divide-y divide-[#232e3c]/40">
                <!-- Dynamic user items will load here -->
            </div>
        </div>

        <!-- RIGHT CHAT WINDOW -->
        <div id="chat-window-area" class="hidden md:flex flex-1 flex-col bg-[#0e1621] h-full">
            <!-- Placeholder before selecting a chat -->
            <div id="no-chat-selected" class="flex-1 flex flex-col items-center justify-center p-6 text-center text-[#7f91a4]">
                <div class="text-5xl mb-3">💬</div>
                <p class="text-sm font-medium">Select a user from the sidebar to start direct messaging</p>
            </div>

            <!-- Active Chat Interface -->
            <div id="active-chat-box" class="hidden flex-1 flex flex-col h-full">
                <!-- Chat Header -->
                <div class="bg-[#17212b] px-5 py-3 flex items-center justify-between border-b border-[#232e3c]">
                    <div class="flex items-center gap-3">
                        <div id="active-chat-avatar" class="w-9 h-9 rounded-full bg-[#2481cc] flex items-center justify-center font-bold text-white text-sm">?</div>
                        <div>
                            <h3 id="active-chat-name" class="font-bold text-white text-sm">Select Name</h3>
                            <p id="active-chat-status" class="text-[11px] text-[#2481cc]">online</p>
                        </div>
                    </div>
                </div>

                <!-- Messages Stream -->
                <div id="chat-messages-box" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[radial-gradient(#17212b_1px,transparent_1px)] [background-size:20px_20px]">
                    <!-- Dynamic chat messages -->
                </div>

                <!-- Chat Input Footer -->
                <div class="bg-[#17212b] px-4 py-3 flex items-center gap-2 border-t border-[#232e3c]">
                    <input type="text" id="chat-message-input" placeholder="Write a message..." onkeypress="handleChatKeyPress(event)" class="flex-1 bg-[#0e1621] text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none border border-[#232e3c] placeholder-[#7f91a4]">
                    <button onclick="sendDirectMessage()" class="bg-[#2481cc] hover:bg-[#1d6fa5] text-white p-2.5 rounded-xl transition cursor-pointer flex items-center justify-center shadow" title="Send">
                        <svg viewBox="0 0 24 24" height="20" width="20" preserveAspectRatio="xMidYMid meet" version="1.1"><path fill="currentColor" d="M1.101,21.757L23.8,12.028L1.101,2.3l0.011,7.912l13.613,1.816L1.112,13.845 L1.101,21.757z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmVtAF5wQrcrzlfjpTAZoLDFbyrpr9FmY",
            authDomain: "secret-d7e10.firebaseapp.com",
            databaseURL: "https://secret-d7e10-default-rtdb.firebaseio.com",
            projectId: "secret-d7e10",
            storageBucket: "secret-d7e10.firebasestorage.app",
            messagingSenderId: "51435664110",
            appId: "1:51435664110:web:feb706ce8a92f182dd39ff"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let loggedInUser = null; // { username, name }
        let activeChatUser = null; // Selected user object to chat with
        let messagesListenerRef = null;
        let allUsersCache = [];

        // Tab Switcher for Login / Register
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition bg-[#2481cc] text-white cursor-pointer";
                regBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition text-[#7f91a4] cursor-pointer";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                regBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition bg-[#2481cc] text-white cursor-pointer";
                loginBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition text-[#7f91a4] cursor-pointer";
            }
        }

        // Auto Login check on Page Load via localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tg_secure_user');
            if (savedUser) {
                loggedInUser = JSON.parse(savedUser);
                enterTelegramApp();
            }
        });

        // Register Account
        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            let username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value.trim();

            if (!name || !username || !password) {
                alert("Please fill in all registration fields!");
                return;
            }

            // Sanitize username (alphanumeric & underscore only)
            username = username.replace(/[^a-zA-Z0-9_]/g, "");

            db.ref(`users/${username}`).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    alert("Username already taken! Choose another one.");
                } else {
                    const userData = { name, username, password, online: true, lastSeen: Date.now() };
                    db.ref(`users/${username}`).set(userData).then(() => {
                        loggedInUser = userData;
                        localStorage.setItem('tg_secure_user', JSON.stringify(userData));
                        enterTelegramApp();
                    });
                }
            });
        }

        // Login Account
        function handleLogin() {
            let username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                alert("Please enter username and password!");
                return;
            }

            db.ref(`users/${username}`).once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    alert("Username not found! Please register first.");
                    return;
                }
                const userData = snapshot.val();
                if (userData.password !== password) {
                    alert("Incorrect password!");
                    return;
                }

                loggedInUser = userData;
                localStorage.setItem('tg_secure_user', JSON.stringify(userData));
                enterTelegramApp();
            });
        }

        function enterTelegramApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('telegram-screen').classList.remove('hidden');

            document.getElementById('current-user-name').innerText = loggedInUser.name;
            document.getElementById('current-user-handle').innerText = "@" + loggedInUser.username;
            document.getElementById('user-avatar').innerText = loggedInUser.name.charAt(0).toUpperCase();

            updateOnlineStatus(true);
            loadUsersList();
        }

        function updateOnlineStatus(isOnline) {
            if (!loggedInUser) return;
            db.ref(`users/${loggedInUser.username}`).update({
                online: isOnline,
                lastSeen: Date.now()
            });
        }

        window.addEventListener('beforeunload', () => {
            if (loggedInUser) {
                db.ref(`users/${loggedInUser.username}`).update({ online: false, lastSeen: Date.now() });
            }
        });

        function logout() {
            updateOnlineStatus(false);
            localStorage.removeItem('tg_secure_user');
            location.reload();
        }

        // Load Users List in Left Sidebar
        function loadUsersList() {
            const container = document.getElementById('users-list-container');
            
            db.ref('users').on('value', (snapshot) => {
                container.innerHTML = "";
                allUsersCache = [];

                snapshot.forEach((childSnap) => {
                    const user = childSnap.val();
                    if (user.username !== loggedInUser.username) {
                        allUsersCache.push(user);
                    }
                });

                renderUserListUI(allUsersCache);
            });
        }

        function renderUserListUI(users) {
            const container = document.getElementById('users-list-container');
            container.innerHTML = "";

            if (users.length === 0) {
                container.innerHTML = `<p class="text-xs text-[#7f91a4] text-center p-4">No other users found.</p>`;
                return;
            }

            users.forEach((user) => {
                const isOnline = user.online;
                const statusText = isOnline ? '<span class="text-[#2481cc]">online</span>' : '<span class="text-[#7f91a4]">offline</span>';
                const initial = user.name.charAt(0).toUpperCase();

                const userDiv = document.createElement('div');
                userDiv.className = `flex items-center gap-3 p-3 cursor-pointer hover:bg-[#202b38] transition ${activeChatUser && activeChatUser.username === user.username ? 'bg-[#202b38]' : ''}`;
                userDiv.onclick = () => selectChatUser(user);

                userDiv.innerHTML = `
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full bg-[#2481cc] flex items-center justify-center font-bold text-white text-sm shadow">${initial}</div>
                        ${isOnline ? '<span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#17212b] rounded-full"></span>' : ''}
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-white text-sm truncate">${escapeHTML(user.name)}</h4>
                        </div>
                        <p class="text-xs text-[#7f91a4] truncate">@${escapeHTML(user.username)} &bull; ${statusText}</p>
                    </div>
                `;
                container.appendChild(userDiv);
            });
        }

        function filterUsers(query) {
            const q = query.toLowerCase().trim();
            const filtered = allUsersCache.filter(u => u.username.includes(q) || u.name.toLowerCase().includes(q));
            renderUserListUI(filtered);
        }

        // Select Chat User & Open Right Window
        function selectChatUser(user) {
            activeChatUser = user;

            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('active-chat-box').classList.remove('hidden');

            document.getElementById('active-chat-name').innerText = user.name;
            document.getElementById('active-chat-avatar').innerText = user.name.charAt(0).toUpperCase();
            document.getElementById('active-chat-status').innerText = user.online ? 'online' : 'offline';

            // Highlight in sidebar
            loadUsersList();

            // Load Private Chat Messages
            loadDirectMessages();
        }

        // Generate Unique Chat Room ID between two users (alphabetically sorted)
        function getChatRoomId(user1, user2) {
            return user1 < user2 ? `${user1}_${user2}` : `${user2}_${user1}`;
        }

        function loadDirectMessages() {
            const msgBox = document.getElementById('chat-messages-box');
            msgBox.innerHTML = "";

            if (messagesListenerRef) {
                messagesListenerRef.off();
            }

            const chatId = getChatRoomId(loggedInUser.username, activeChatUser.username);
            messagesListenerRef = db.ref(`chats/${chatId}/messages`);

            messagesListenerRef.limitToLast(50).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                renderChatMessage(msg);
            });
        }

        function renderChatMessage(msg) {
            const msgBox = document.getElementById('chat-messages-box');
            const isMe = msg.sender === loggedInUser.username;

            const div = document.createElement('div');
            div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} anim-fade my-1`;

            div.innerHTML = `
                <div class="max-w-[70%] rounded-2xl px-4 py-2 shadow-md ${isMe ? 'bg-[#2b5278] text-white rounded-tr-none' : 'bg-[#182533] text-white rounded-tl-none'}">
                    <p class="break-words text-sm leading-relaxed">${escapeHTML(msg.text)}</p>
                    <div class="text-[10px] text-[#7f91a4] text-right mt-1 font-medium">${msg.time}</div>
                </div>
            `;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') {
                sendDirectMessage();
            }
        }

        function sendDirectMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            const chatId = getChatRoomId(loggedInUser.username, activeChatUser.username);
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgData = {
                sender: loggedInUser.username,
                text: text,
                time: timeString,
                timestamp: Date.now()
            };

            db.ref(`chats/${chatId}/messages`).push(msgData);
            input.value = "";
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
