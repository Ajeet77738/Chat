<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group WhatsApp Secret Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-anim {
            animation: fadeIn 0.2s ease-out forwards;
        }
        .msg-container:hover .msg-actions {
            opacity: 1;
            pointer-events: auto;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b141a;
        }
        ::-webkit-scrollbar-thumb {
            background: #202c33;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00a884;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0b141a] via-[#111b21] to-[#070d12] text-[#e9edef] h-screen flex flex-col justify-center items-center m-0 font-sans p-0 md:p-4">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="bg-[#111b21]/95 backdrop-blur-xl p-8 rounded-2xl shadow-2xl w-96 border border-[#2a3942]/60 shadow-[0_0_30px_rgba(0,168,132,0.1)]">
        <div class="text-center mb-6">
            <div class="inline-block p-3 rounded-full bg-[#00a884]/10 text-[#00a884] text-3xl mb-2 shadow-[0_0_15px_rgba(0,168,132,0.3)]">👥</div>
            <h1 class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-[#00a884] to-[#25d366]">Group Secret Chat</h1>
            <p class="text-xs text-[#8696a0] mt-1">Enter room & your name</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#00a884] mb-1">Room Passcode</label>
                <input type="text" id="room-input" placeholder="e.g. group-room-123" class="w-full bg-[#2a3942]/50 border border-[#374248] rounded-xl p-3 text-white focus:outline-none focus:border-[#00a884] focus:ring-1 focus:ring-[#00a884] transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-[#00a884] mb-1">Your Nickname</label>
                <input type="text" id="name-input" placeholder="e.g. Alex" class="w-full bg-[#2a3942]/50 border border-[#374248] rounded-xl p-3 text-white focus:outline-none focus:border-[#00a884] focus:ring-1 focus:ring-[#00a884] transition">
            </div>
            <button onclick="joinRoom()" class="w-full bg-gradient-to-r from-[#00a884] to-[#25d366] text-black font-bold py-3 rounded-xl hover:opacity-90 shadow-[0_4px_20px_rgba(0,168,132,0.4)] transition cursor-pointer active:scale-95">
                Join Group 🚀
            </button>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="hidden w-full max-w-4xl h-full md:h-[92vh] bg-[#111b21] md:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-[#222d34] shadow-[0_0_40px_rgba(0,0,0,0.8)]">
        <!-- Chat Header -->
        <div class="bg-[#202c33] px-5 py-3 flex items-center justify-between border-b border-[#2a3942]">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-[#00a884] to-[#25d366] flex items-center justify-center text-black font-bold text-base shadow">💬</div>
                <div>
                    <h2 id="room-title" class="font-bold text-white text-sm md:text-base tracking-wide">Room: </h2>
                    <p id="typing-status" class="text-[11px] text-[#00a884] h-3.5 font-medium animate-pulse">🟢 Active</p>
                </div>
            </div>
            <button onclick="leaveRoom()" class="text-xs bg-[#2a3942] hover:bg-[#374248] text-[#8696a0] hover:text-white px-3 py-1.5 rounded-lg transition font-semibold cursor-pointer border border-[#374248]">Leave Room</button>
        </div>

        <!-- Messages Box -->
        <div id="messages-container" class="flex-1 p-5 overflow-y-auto space-y-4 bg-[#0b141a] bg-[radial-gradient(#111b21_1px,transparent_1px)] [background-size:16px_16px]">
            <!-- Dynamic messages load here -->
        </div>

        <!-- Input Box -->
        <div class="bg-[#202c33] px-4 py-2.5 flex items-center gap-2 border-t border-[#2a3942]">
            <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
            <button onclick="document.getElementById('file-input').click()" class="text-[#8696a0] hover:text-[#00a884] p-2 rounded-full transition cursor-pointer text-xl flex items-center justify-center" title="Attach File / Image">
                📎
            </button>
            <input type="text" id="message-input" placeholder="Type a message" oninput="updateTypingStatus()" onkeypress="handleKeyPress(event)" class="flex-1 bg-[#2a3942] text-white text-sm rounded-lg px-4 py-2.5 focus:outline-none placeholder-[#8696a0]">
            <button onclick="sendMessage()" class="text-[#8696a0] hover:text-[#00a884] p-2 rounded-full transition cursor-pointer text-xl flex items-center justify-center" title="Send Message">
                <svg viewBox="0 0 24 24" height="24" width="24" preserveAspectRatio="xMidYMid meet" version="1.1" x="0px" y="0px"><path fill="currentColor" d="M1.101,21.757L23.8,12.028L1.101,2.3l0.011,7.912l13.613,1.816L1.112,13.845 L1.101,21.757z"></path></svg>
            </button>
        </div>
    </div>

    <!-- MESSAGE INFO MODAL -->
    <div id="info-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#202c33] border border-[#2a3942] p-6 rounded-2xl w-full max-w-md shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-[#2a3942] pb-3">
                <h3 class="font-bold text-white text-base">Message Info</h3>
                <button onclick="closeInfoModal()" class="text-[#8696a0] hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div class="space-y-4 max-h-60 overflow-y-auto">
                <div>
                    <p class="text-xs font-bold text-[#00a884] uppercase tracking-wider mb-2">Read by</p>
                    <div id="read-by-list" class="space-y-1 text-sm text-white"></div>
                </div>
                <div>
                    <p class="text-xs font-bold text-[#8696a0] uppercase tracking-wider mb-2">Delivered to</p>
                    <div id="delivered-to-list" class="space-y-1 text-sm text-white"></div>
                </div>
            </div>
            <button onclick="closeInfoModal()" class="w-full bg-[#2a3942] hover:bg-[#374248] text-white py-2 rounded-xl text-sm transition">Close</button>
        </div>
    </div>

    <!-- DELETE OPTIONS MODAL -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-[#202c33] border border-[#2a3942] p-6 rounded-2xl w-80 shadow-2xl text-center space-y-4">
            <h3 class="font-bold text-white text-base">Delete Message?</h3>
            <div class="space-y-2">
                <button onclick="confirmDelete('me')" class="w-full bg-[#2a3942] hover:bg-[#374248] text-white py-2.5 rounded-xl font-medium transition text-sm">Delete for Me</button>
                <button onclick="confirmDelete('everyone')" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 py-2.5 rounded-xl font-medium transition text-sm">Delete for Everyone</button>
                <button onclick="closeDeleteModal()" class="w-full text-[#8696a0] hover:text-white py-2 text-sm">Cancel</button>
            </div>
        </div>
    </div>
        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmVtAF5wQrcrzlfjpTAZoLDFbyrpr9FmY",
            authDomain: "secret-d7e10.firebaseapp.com",
            databaseURL: "https://secret-d7e10-default-rtdb.firebaseio.com",
            projectId: "secret-d7e10",
            storageBucket: "secret-d7e10.firebasestorage.app",
            messagingSenderId: "51435664110",
            appId: "1:51435664110:web:feb706ce8a92f182dd39ff"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = "";
        let currentUser = "";
        let typingTimeout = null;
        let selectedMessageKey = null;

        const nameColors = {};
        const colorPalette = ['#00a884', '#34b7f1', '#ffbc42', '#ff5722', '#ab47bc', '#26a69a', '#ec407a'];
        function getColorForUser(name) {
            if (!nameColors[name]) {
                let hash = 0;
                for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
                nameColors[name] = colorPalette[Math.abs(hash) % colorPalette.length];
            }
            return nameColors[name];
        }

        function sanitizeRoomName(room) {
            return room.replace(/[.#$\/\[\]]/g, "_").toLowerCase();
        }

        function joinRoom() {
            const rawRoom = document.getElementById('room-input').value.trim();
            const name = document.getElementById('name-input').value.trim();

            if (!rawRoom || !name) {
                alert("Please fill in both fields!");
                return;
            }

            currentRoom = sanitizeRoomName(rawRoom);
            currentUser = name;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('room-title').innerText = "Room: " + rawRoom;

            loadMessages();
            listenForTyping();
            updatePresence(true);
        }

        function updatePresence(isOnline) {
            if (!currentRoom || !currentUser) return;
            db.ref(`rooms/${currentRoom}/presence/${currentUser}`).set({
                online: isOnline,
                lastSeen: Date.now()
            });

            db.ref(`rooms/${currentRoom}/messages`).once('value', (snapshot) => {
                snapshot.forEach((childSnap) => {
                    const msg = childSnap.val();
                    if (msg.sender !== currentUser) {
                        db.ref(`rooms/${currentRoom}/messages/${childSnap.key}/deliveredTo/${currentUser}`).set(true);
                        db.ref(`rooms/${currentRoom}/messages/${childSnap.key}/readBy/${currentUser}`).set(true);
                    }
                });
            });
        }

        window.addEventListener('beforeunload', () => {
            if (currentRoom && currentUser) {
                db.ref(`rooms/${currentRoom}/typing/${currentUser}`).set(false);
                db.ref(`rooms/${currentRoom}/presence/${currentUser}`).update({ online: false });
            }
        });

        function leaveRoom() {
            updatePresence(false);
            location.reload();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function updateTypingStatus() {
            if (!currentRoom || !currentUser) return;
            const typingRef = db.ref(`rooms/${currentRoom}/typing/${currentUser}`);
            typingRef.set(true);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                typingRef.set(false);
            }, 2000);
        }

        function listenForTyping() {
            db.ref(`rooms/${currentRoom}/typing`).on('value', (snapshot) => {
                const typingData = snapshot.val() || {};
                let typingUsers = [];

                for (let user in typingData) {
                    if (user !== currentUser && typingData[user] === true) {
                        typingUsers.push(user);
                    }
                }

                const statusEl = document.getElementById('typing-status');
                if (typingUsers.length > 0) {
                    statusEl.innerText = typingUsers.join(', ') + " is typing...";
                } else {
                    statusEl.innerText = "🟢 Active in group";
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            db.ref(`rooms/${currentRoom}/typing/${currentUser}`).set(false);
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const messageData = {
                sender: currentUser,
                text: text,
                type: 'text',
                time: timeString,
                deliveredTo: { [currentUser]: true },
                readBy: { [currentUser]: true },
                timestamp: Date.now()
            };

            const newMsgRef = db.ref(`rooms/${currentRoom}/messages`).push();
            newMsgRef.set(messageData);

            db.ref(`rooms/${currentRoom}/presence`).once('value', (snap) => {
                snap.forEach((userSnap) => {
                    const member = userSnap.key;
                    if (member !== currentUser) {
                        db.ref(`rooms/${currentRoom}/messages/${newMsgRef.key}/deliveredTo/${member}`).set(true);
                        db.ref(`rooms/${currentRoom}/messages/${newMsgRef.key}/readBy/${member}`).set(true);
                    }
                });
            });

            input.value = "";
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 1500000) {
                alert("File size is too large! Please choose a file under 1.5MB.");
                event.target.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const messageData = {
                    sender: currentUser,
                    fileName: file.name,
                    fileData: base64Data,
                    fileType: file.type,
                    type: file.type.startsWith('image/') ? 'image' : 'file',
                    time: timeString,
                    deliveredTo: { [currentUser]: true },
                    readBy: { [currentUser]: true },
                    timestamp: Date.now()
                };

                const newMsgRef = db.ref(`rooms/${currentRoom}/messages`).push();
                newMsgRef.set(messageData);

                db.ref(`rooms/${currentRoom}/presence`).once('value', (snap) => {
                    snap.forEach((userSnap) => {
                        const member = userSnap.key;
                        if (member !== currentUser) {
                            db.ref(`rooms/${currentRoom}/messages/${newMsgRef.key}/deliveredTo/${member}`).set(true);
                            db.ref(`rooms/${currentRoom}/messages/${newMsgRef.key}/readBy/${member}`).set(true);
                        }
                    });
                });

                event.target.value = "";
            };
            reader.readAsDataURL(file);
        }

        function loadMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = "";

            db.ref(`rooms/${currentRoom}/messages`).limitToLast(50).on('child_added', (snapshot) => {
                renderSingleMessage(snapshot.key, snapshot.val());
            });

            db.ref(`rooms/${currentRoom}/messages`).on('child_changed', (snapshot) => {
                const existingEl = document.getElementById(`msg-${snapshot.key}`);
                if (existingEl) {
                    const msg = snapshot.val();
                    if (msg.deletedForEveryone) {
                        existingEl.innerHTML = `<p class="italic text-[#8696a0] text-xs">🔒 This message was deleted</p>`;
                    }
                }
            });

            db.ref(`rooms/${currentRoom}/messages`).on('child_removed', (snapshot) => {
                const existingEl = document.getElementById(`msg-${snapshot.key}`);
                if (existingEl) existingEl.remove();
            });
        }

        function renderSingleMessage(key, msg) {
            const container = document.getElementById('messages-container');
            const isMe = msg.sender === currentUser;
            const userColor = getColorForUser(msg.sender);

            if (msg.deletedForMe && msg.deletedForMe[currentUser]) return;

            const messageDiv = document.createElement('div');
            messageDiv.id = `msg-${key}`;
            messageDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'} message-anim relative msg-container my-1`;

            let contentHTML = '';
            if (msg.deletedForEveryone) {
                contentHTML = `<p class="italic text-[#8696a0] text-xs">🔒 This message was deleted</p>`;
            } else if (msg.type === 'image') {
                contentHTML = `
                    <a href="${msg.fileData}" target="_blank" class="block mb-1">
                        <img src="${msg.fileData}" class="max-w-xs rounded-xl max-h-60 object-cover border border-white/10 shadow-md">
                    </a>
                    <p class="text-[10px] text-[#8696a0] truncate max-w-xs">${escapeHTML(msg.fileName || '')}</p>
                `;
            } else if (msg.type === 'file') {
                contentHTML = `
                    <div class="flex items-center gap-3 mb-1 bg-[#111b21]/80 p-2.5 rounded-xl border border-[#374248]">
                        <span class="text-2xl">📄</span>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold truncate max-w-[170px] text-white">${escapeHTML(msg.fileName || 'Document')}</p>
                            <a href="${msg.fileData}" download="${msg.fileName || 'file'}" class="text-[11px] text-[#00a884] font-semibold hover:underline">Download File 📥</a>
                        </div>
                    </div>
                `;
            } else {
                contentHTML = `<p class="break-words pb-1 text-sm md:text-base leading-relaxed">${escapeHTML(msg.text || '')}</p>`;
            }

            let ticks = '';
            if (isMe && !msg.deletedForEveryone) {
                ticks = `<span class="ml-1 text-[#34b7f1] font-bold">✓✓</span>`;
            }

            let actionButtons = '';
            if (!msg.deletedForEveryone) {
                const infoBtn = isMe ? `<button onclick="openMessageInfo('${key}')" class="bg-[#202c33] hover:bg-[#2a3942] text-[#8696a0] hover:text-[#00a884] px-1.5 py-0.5 rounded text-xs shadow border border-[#2a3942]" title="Message Info">ℹ️</button>` : '';
                const deleteBtn = `<button onclick="openDeleteModal('${key}')" class="bg-[#202c33] hover:bg-[#2a3942] text-[#8696a0] hover:text-red-400 px-1.5 py-0.5 rounded text-xs shadow border border-[#2a3942]" title="Delete Message">🗑️</button>`;
                
                actionButtons = `
                    <div class="msg-actions opacity-0 transition absolute -top-3 ${isMe ? 'left-2' : 'right-2'} flex items-center gap-1 z-10">
                        ${infoBtn}
                        ${deleteBtn}
                    </div>
                `;
            }

            messageDiv.innerHTML = `
                <div class="relative max-w-[75%] md:max-w-[65%] rounded-2xl px-4 py-2 shadow-lg ${isMe ? 'bg-[#005c4b]' : 'bg-[#202c33]'} text-white ${isMe ? 'rounded-tr-none' : 'rounded-tl-none'}">
                    ${actionButtons}
                    ${!isMe ? `<p class="text-xs font-bold mb-1" style="color: ${userColor};">${msg.sender}</p>` : ''}
                    ${contentHTML}
                    <div class="text-[10px] text-[#8696a0] text-right mt-1 font-medium flex items-center justify-end gap-1">
                        <span>${msg.time || ''}</span>
                        ${ticks}
                    </div>
                </div>
            `;

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function openMessageInfo(msgKey) {
            db.ref(`rooms/${currentRoom}/messages/${msgKey}`).once('value', (snapshot) => {
                const msg = snapshot.val();
                if (!msg) return;

                const readByList = document.getElementById('read-by-list');
                const deliveredToList = document.getElementById('delivered-to-list');

                readByList.innerHTML = '';
                deliveredToList.innerHTML = '';

                const readBy = msg.readBy || {};
                const deliveredTo = msg.deliveredTo || {};

                for (let user in readBy) {
                    readByList.innerHTML += `<div class="flex items-center justify-between bg-[#111b21] px-3 py-1.5 rounded-lg border border-[#2a3942]"><span>${user}</span> <span class="text-xs text-[#00a884]">Read ✓✓</span></div>`;
                }

                for (let user in deliveredTo) {
                    if (!readBy[user]) {
                        deliveredToList.innerHTML += `<div class="flex items-center justify-between bg-[#111b21] px-3 py-1.5 rounded-lg border border-[#2a3942]"><span>${user}</span> <span class="text-xs text-[#8696a0]">Delivered ✓</span></div>`;
                    }
                }

                if (readByList.innerHTML === '') readByList.innerHTML = '<p class="text-xs text-[#8696a0]">No one yet</p>';
                if (deliveredToList.innerHTML === '') deliveredToList.innerHTML = '<p class="text-xs text-[#8696a0]">All read</p>';

                document.getElementById('info-modal').classList.remove('hidden');
            });
        }

        function closeInfoModal() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        function openDeleteModal(msgKey) {
            selectedMessageKey = msgKey;
            document.getElementById('delete-modal').classList.add('hidden');
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            selectedMessageKey = null;
            document.getElementById('delete-modal').classList.add('hidden');
        }

        function confirmDelete(type) {
            if (!selectedMessageKey) return;

            if (type === 'me') {
                db.ref(`rooms/${currentRoom}/messages/${selectedMessageKey}/deletedForMe/${currentUser}`).set(true);
                const el = document.getElementById(`msg-${selectedMessageKey}`);
                if (el) el.remove();
            } else if (type === 'everyone') {
                db.ref(`rooms/${currentRoom}/messages/${selectedMessageKey}`).update({
                    deletedForEveryone: true,
                    text: "",
                    fileData: "",
                    fileName: ""
                });
            }

            closeDeleteModal();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
